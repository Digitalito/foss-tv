        Tailscale is a mesh VPN built on WireGuard that makes it easy to connect all your devices together securely. Access your home network, servers, and other Tailscale devices from anywhere without complex firewall configuration.

windscribe:
  git: "https://github.com/Windscribe/Android-App"
  author_name: "Windscribe"
  summary: |
