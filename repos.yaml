      id: "com.windscribe.vpn"
      name: "Windscribe VPN"
      categories:
        - VPN
      description: |
        Windscribe is a free VPN service for Android that unblocks geo-restricted content and eliminates tracking by advertisers. Includes a firewall, R.O.B.E.R.T. ad blocker, and 10GB/month free bandwidth.

