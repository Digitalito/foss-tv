    A minimal, open-source Android TV launcher with WiFi data usage widget, OLED-friendly screensaver, and improved UX.
  applications:
    - filename: "arclauncher.apk"
      id: "com.meddouribadis.arclauncher"
      name: "Arc Launcher"
      categories:
