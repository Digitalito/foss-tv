      id: "com.google.android.leanbacklauncher"
      name: "LeanbackLauncher"
      categories:
        - Launcher
      description: |
        A fork of Google's Leanback Launcher for Android TV with additional features and improvements. Provides a familiar TV home screen experience with enhanced functionality.

ltv-launcher:
  git: "https://github.com/LeanBitLab/LtvLauncher"
  author_name: "LeanBitLab"
  summary: |
    A minimal, open-source Android TV launcher with WiFi data usage widget and OLED-friendly screensaver.
  applications:
    - filename: "LtvLauncher.apk"
      id: "com.leanbitslab.ltvlauncher"
      name: "LTvLauncher"
      categories:
        - Launcher
      description: |
        A minimal, open-source Android TV launcher featuring a WiFi data usage widget, an inbuilt OLED friendly screensaver, and improved UX.

